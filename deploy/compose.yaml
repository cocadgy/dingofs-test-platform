name: dingofs-test-platform
services:
  db:
    image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: platform
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD}@db:5432/platform
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD}@db:5432/platform
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE:-true}
      PLATFORM_CREDENTIAL_ENCRYPTION_KEY: ${PLATFORM_CREDENTIAL_ENCRYPTION_KEY:-}
      PLATFORM_SSH_KNOWN_HOSTS: /app/deploy/ssh/known_hosts
      PLATFORM_CLUSTER_DISCOVERY_TIMEOUT: ${PLATFORM_CLUSTER_DISCOVERY_TIMEOUT:-60}
      PLATFORM_CLUSTER_STATUS_TIMEOUT: ${PLATFORM_CLUSTER_STATUS_TIMEOUT:-120}
      PLATFORM_CLUSTER_MAX_BYTES: ${PLATFORM_CLUSTER_MAX_BYTES:-2097152}
      PLATFORM_CLUSTER_MACHINE_CONCURRENCY: ${PLATFORM_CLUSTER_MACHINE_CONCURRENCY:-2}
      PLATFORM_CLUSTER_AUTH_SECONDS: ${PLATFORM_CLUSTER_AUTH_SECONDS:-300}
      PLATFORM_CLUSTER_DISCOVERY_SECONDS: ${PLATFORM_CLUSTER_DISCOVERY_SECONDS:-900}
    volumes:
      - ./ssh:/app/deploy/ssh:ro
    command: [uvicorn, dingofs_platform.app:create_app, --factory, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '*']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - '172.30.14.126:${PLATFORM_HTTP_PORT:-58080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
