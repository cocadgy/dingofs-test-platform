[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "dingofs-test-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "psycopg[binary]", "pydantic-settings", "argon2-cffi", "ruamel.yaml"]
[project.optional-dependencies]
test = ["pytest", "httpx"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.setuptools.packages.find]
where = ["src"]
